
name: Build UstaHisob APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UstaHisob_AndroidStudio_loyihasi.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -q UstaHisob_AndroidStudio_loyihasi.zip -d extracted
          DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UstaHisob-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
