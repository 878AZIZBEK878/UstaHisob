
name: Build UstaHisob APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UstaHisob_AndroidStudio_loyihasi.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q UstaHisob_AndroidStudio_loyihasi.zip -d extracted

          SETTINGS=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle topilmadi"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Fix AndroidX dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.glob("app/build.gradle"))
          files += list(root.glob("app/build.gradle.kts"))

          if not files:
              raise SystemExit("app/build.gradle topilmadi")

          p = files[0]
          s = p.read_text()

          if "androidx.core:core" not in s:
              m = re.search(r'(?m)^\s*dependencies\s*\{', s)

              if not m:
                  raise SystemExit("dependencies bloki topilmadi")

              i = s.find('\n', m.start()) + 1

              if p.suffix == ".kts":
                  dep = '    implementation("androidx.core:core:1.15.0")\n'
              else:
                  dep = "    implementation 'androidx.core:core:1.15.0'\n"

              s = s[:i] + dep + s[i:]
              p.write_text(s)

          print("AndroidX Core tayyor")
          PY

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UstaHisob-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
